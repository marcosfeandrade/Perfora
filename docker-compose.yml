services:
  postgres:
    image: postgres:16-alpine
    container_name: perfora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: perfora
    ports:
      - "5434:5432"
    volumes:
      - perfora_pgdata:/var/lib/postgresql/data

volumes:
  perfora_pgdata:
